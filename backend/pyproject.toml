[project]
name = "budget-saas-backend"
version = "1.0.0"
description = "Multi-tenant budget management SaaS — backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
